# Make a GitHub release when a version tag (v3.0.0) is pushed, with the built package attached.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: The tag names the version pyproject.toml states
        run: |
          stated="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v$stated" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject.toml $stated"; exit 1; }
      - run: python -m pip install "build>=1.2,<2"
      - run: python -m build
      - name: The wheel holds the add-on files and the type marker
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert any(n.endswith("/py.typed") for n in names), "no py.typed in the wheel"
          assert any("/addons/" in n and n.endswith(".json") for n in names), "no add-on files in the wheel"
          EOF
      - name: A release on GitHub with the built package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-cpp-conversation"
version = "3.1.0"
description = "A KV-cache managing chat wrapper around llama.cpp: prefill as little as possible, evict the oldest exchanges."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Felix Lindenmeier" }]
keywords = ["llama.cpp", "llm", "chat", "kv-cache", "gguf", "tool-calling", "inference"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    # Build llama-cpp-python from source per machine (see install.sh):
    #   CPU:        CMAKE_ARGS="-DGGML_NATIVE=ON" pip install --no-binary llama-cpp-python
    #   Nvidia GPU: CMAKE_ARGS="-DGGML_CUDA=on" pip install --no-binary llama-cpp-python
    "llama-cpp-python>=0.3.23",
    # The bounds of every dependency: docs/decisions/0053-dependencies-are-bounded-to-what-is-checked.md
    "jinja2>=3.1.6,<3.2",
]

[project.urls]
Homepage = "https://github.com/Flinlix/llama-cpp-conversation"
Documentation = "https://flinlix.github.io/llama-cpp-conversation/"
Source = "https://github.com/Flinlix/llama-cpp-conversation"
Issues = "https://github.com/Flinlix/llama-cpp-conversation/issues"

[project.optional-dependencies]
test = ["pytest>=7,<10", "pytest-xdist>=3,<4", "hypothesis>=6,<7"]
dev = ["mypy>=1,<3", "ruff>=0.5,<0.18", "mutmut>=3,<4"]
docs = ["sphinx>=9.0,<10", "myst-parser>=5,<6", "furo>=2025.12,<2027"]

[tool.setuptools.packages.find]
include = ["llama_cpp_conversation*"]

[tool.setuptools.package-data]
llama_cpp_conversation = ["addons/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The long random runs and the runs on real model files are asked for by name: -m slow, -m gpu.
addopts = "-m 'not slow and not gpu'"

[tool.ruff]
# The project's one-line docstrings run long; the length of a line is left to the writer.
lint.select = ["E", "F", "W", "B"]
lint.ignore = ["E501", "B905"]

[tool.mypy]
packages = ["llama_cpp_conversation"]
# The engine's bindings ship no types.
ignore_missing_imports = true

[tool.mutmut]
# A run now and then, for hours: python -m tests.mutation_run, then mutmut results.
source_paths = ["llama_cpp_conversation/"]
# The protocol a cache context answers, which the library reads by its method names, and the
# engine's own modules, which only a real model runs.
do_not_mutate = ["llama_cpp_conversation/cache_context.py", "llama_cpp_conversation/_backend.py",
                 "llama_cpp_conversation/context.py", "llama_cpp_conversation/testing/*"]
# What the tests read besides the code.
also_copy = ["README.md", "AGENTS.md", "CLAUDE.md", "docs", "pyproject.toml", "install.sh",
             "LICENSE", "NOTICE", "examples", "hooks"]
# A test that bounds its processor time runs slower under mutation than it allows; one that
# reads the source, or traces its functions by name, reads the mutation tool's rewritten copy.
pytest_add_cli_args = [
    "-p", "no:cacheprovider", "-x", "-q", "-m", "not slow and not gpu and not timed",
    "--ignore=tests/test_static.py",
    "--deselect=tests/test_loops.py::test_every_loop_makes_progress_on_each_pass_or_ends_by_construction",
    "--deselect=tests/test_wrapper.py::test_a_reply_on_a_template_without_reasoning_tools_or_a_clock_never_enters_their_code",
    "--deselect=tests/test_public_errors.py::test_every_public_method_and_property_of_the_wrapper_goes_through_the_one_entry_point",
]
